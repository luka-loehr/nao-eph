[package]
name = "nao_eph_voice"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Talk to the NAO: an ElevenLabs voice agent whose tools move the robot through HULKs"

[[bin]]
name = "nao-eph-voice"
path = "src/main.rs"

[dependencies]
base64 = { workspace = true }
clap = { workspace = true }
color-eyre = { workspace = true }
cpal = "0.16"
serde_json = { workspace = true }
tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
