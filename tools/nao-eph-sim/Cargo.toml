[package]
name = "nao-eph-sim"
version = "0.1.0"
edition = "2024"
description = "Native 3D viewer and control app for a NAO running in Webots"
license = "GPL-3.0-only"

[workspace]

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.34", features = ["bytemuck"] }
gpui = "0.2.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
pollster = "0.4"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = "0.30"
ureq = "3"
wgpu = "30"
